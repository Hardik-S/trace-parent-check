[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-parent-check"
version = "0.1.0"
description = "Offline validator for normalized trace parent relationships"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Trace Parent Check contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
trace-parent-check = "trace_parent_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
